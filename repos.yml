repos:
  - owner: GoldenNugget-Team
    repo: GoldenNugget-mobile
    name: GoldenNugget Mobile
    bundle_id: com.goldennugget.mobile
    icon: https://raw.githubusercontent.com/GoldenNugget-Team/GoldenNugget-mobile/main/layout/Applications/GoldenNuggetMobile.app/AppIcon60x60@2x.png
    stable: newest
    nightly: nightly
    asset_pattern: "*.ipa"

  - owner: Leviidev
    repo: Husk
    name: Husk
    bundle_id: dev.levii.husk
    icon: https://raw.githubusercontent.com/Leviidev/Husk/main/icon.png
    stable: newest
    nightly: prerelease
    asset_pattern: "*.ipa"

  - owner: LiveContainer
    repo: LiveContainer
    name: LiveContainer
    bundle_id: com.kdt.livecontainer
    icon: https://raw.githubusercontent.com/LiveContainer/LiveContainer/main/screenshots/livecontainer_icon.png
    stable: latest
    nightly: nightly
    asset_pattern: "LiveContainer.ipa"

  - owner: LiveContainer
    repo: LiveContainer
    name: LiveContainer + SideStore
    bundle_id: com.kdt.livecontainer.sidestore
    icon: https://raw.githubusercontent.com/LiveContainer/LiveContainer/main/screenshots/livecontainer_icon.png
    stable: latest
    nightly: nightly
    asset_pattern: "LiveContainer+SideStore.ipa"

  - owner: SideStore
    repo: SideStore
    name: SideStore
    bundle_id: com.sidestore.SideStore
    icon: https://raw.githubusercontent.com/SideStore/SideStore/main/Assets/AppIcon.png
    stable: latest
    nightly: nightly
    asset_pattern: "SideStore.ipa"

  - owner: Lakr233
    repo: Asspp
    name: Asspp
    bundle_id: wiki.qaq.Asspp
    icon: https://raw.githubusercontent.com/Lakr233/Asspp/main/Assets/AppIcon.png
    stable: newest
    nightly: prerelease
    asset_pattern: "Asspp.ipa"

  - owner: dompling
    repo: LC-SS-widget-export
    name: LC-SS Widget & FloatingMenu
    type: tweak
    bundle_id: com.dompling.lcss
    icon: https://raw.githubusercontent.com/dompling/LC-SS-widget-export/main/screenshots/icon.png
    stable: newest
    nightly: prerelease
    asset_pattern: "*.dylib,*.framework,*.zip"
    tweak_scope: global
    note: "导入 LiveContainer Tweaks 页 → 签名 → 全局注入生效"

  - owner: Mimosass
    repo: lc-sources
    name: SideStore 简体中文
    bundle_id: com.sidestore.SideStore.zh
    icon: https://raw.githubusercontent.com/SideStore/SideStore/main/Assets/AppIcon.png
    stable: none
    nightly: prerelease
    tag_pattern: "zh-sidestore-nightly"
    asset_pattern: "SideStore-zh-unsigned.ipa"

  - owner: Mimosass
    repo: lc-sources
    name: LiveContainer 简体中文
    bundle_id: com.kdt.livecontainer.zh
    icon: https://raw.githubusercontent.com/LiveContainer/LiveContainer/main/screenshots/livecontainer_icon.png
    stable: none
    nightly: prerelease
    tag_pattern: "zh-livecontainer-nightly"
    asset_pattern: "LiveContainer-zh-unsigned.ipa"
