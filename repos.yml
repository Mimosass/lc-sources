# 以后加软件：大部分情况只写 owner + repo 两行就够了
repos:
  # —— 1. GoldenNugget 正式 App ——
  - owner: GoldenNugget-Team
    repo: GoldenNugget-mobile
    name: GoldenNugget Mobile
    bundle_id: com.goldennugget.mobile
    icon: https://raw.githubusercontent.com/GoldenNugget-Team/GoldenNugget-mobile/main/layout/Applications/GoldenNuggetMobile.app/AppIcon60x60@2x.png
    stable: newest
    nightly: prerelease

  # —— 2. Husk 正式 App ——
  - owner: Leviidev
    repo: Husk
    name: Husk
    bundle_id: dev.levii.husk
    icon: https://raw.githubusercontent.com/Leviidev/Husk/main/icon.png
    stable: newest
    nightly: prerelease

  # —— 3. LC-SS dylib 插件 ——
  - owner: dompling
    repo: LC-SS-widget-export
    name: LC-SS Widget & FloatingMenu
    type: tweak
    bundle_id: com.dompling.lcss
    icon: https://raw.githubusercontent.com/dompling/LC-SS-widget-export/main/screenshots/icon.png
    stable: newest
    nightly: prerelease
    asset_pattern: "*.dylib,*.framework,*.zip"
    tweak_scope: global
    note: "导入 LiveContainer Tweaks 页签名后生效，LCFloatingMenu 全局注入"
